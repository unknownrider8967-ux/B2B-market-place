openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification for the B2B medical supplies marketplace
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Auth
    description: Browser authentication endpoints.
  - name: profile
    description: Current user profile and onboarding
  - name: companies
    description: Vendor/buyer company records
  - name: admin
    description: Admin approval and dashboard operations
  - name: categories
    description: Product categories
  - name: products
    description: Master product catalog
  - name: offers
    description: Vendor product offers
  - name: cart
    description: Buyer shopping cart
  - name: orders
    description: Orders and checkout
  - name: rfqs
    description: Requests for quotation
  - name: wishlist
    description: Buyer wishlist
  - name: notifications
    description: In-app notification center
  - name: reviews
    description: Product and vendor ratings and reviews
  - name: compliance
    description: Medical compliance certificates (FDA/CE/ISO/GMP)
  - name: returns
    description: Returns, claims, and dispute management
  - name: procurement
    description: Multi-step procurement approval chains
  - name: finance
    description: Commission rules, vendor wallet/payouts, credit terms and invoices
  - name: batches
    description: Medical batch/lot and expiry tracking
  - name: substitutes
    description: Product substitution suggestions
  - name: vendor-orders
    description: Vendor sub-orders and purchase orders
  - name: cms
    description: Homepage banners, blog posts, and FAQs
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserEnvelope"
  /auth/register:
    post:
      tags: [Auth]
      operationId: registerWithPassword
      summary: Create an account with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "200":
          description: Account created and session started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserEnvelope"
        "400":
          description: Invalid input.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Email already registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /auth/login:
    post:
      tags: [Auth]
      operationId: loginWithPassword
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Session started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserEnvelope"
        "401":
          description: Invalid credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logoutSession
      summary: Clear the current session (JSON API, no redirect)
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Session cleared.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          description: Relative path to redirect to after login (must start with `/`). Defaults to `/`.
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        "302":
          description: Redirect to the `returnTo` path on success (defaults to `/`) or `/api/login` on failure.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "302":
          description: Redirect to the OIDC provider logout URL.

  /me:
    get:
      operationId: getMyProfile
      tags: [profile]
      summary: Get the current user's profile, role, and company
      responses:
        "200":
          description: Current profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyProfile"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /me/onboard:
    post:
      operationId: onboardMyProfile
      tags: [profile]
      summary: Choose a role (buyer/vendor) and register a company
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardInput"
      responses:
        "200":
          description: Onboarding complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyProfile"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /companies/mine:
    get:
      operationId: getMyCompany
      tags: [companies]
      summary: Get the current user's company
      responses:
        "200":
          description: Company record
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Company"
                  - type: "null"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /admin/companies:
    get:
      operationId: listAdminCompanies
      tags: [admin]
      summary: List all companies for admin review
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, approved, rejected, suspended]
      responses:
        "200":
          description: Companies list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Company"
  /admin/companies/{id}/status:
    patch:
      operationId: updateCompanyStatus
      tags: [admin]
      summary: Approve, reject, or suspend a company
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyStatusUpdate"
      responses:
        "200":
          description: Updated company
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/dashboard:
    get:
      operationId: getAdminDashboard
      tags: [admin]
      summary: Admin dashboard summary stats
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDashboardStats"
  /admin/team:
    get:
      operationId: listAdminTeam
      tags: [admin]
      summary: List all admin users and their sub-roles
      responses:
        "200":
          description: Admin team members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminTeamMember"
  /admin/team/{userId}/role:
    patch:
      operationId: updateAdminRole
      tags: [admin]
      summary: Set an admin user's sub-role (super_admin only)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAdminRoleBody"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTeamMember"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/companies/{id}/verified-badge:
    patch:
      operationId: updateCompanyVerifiedBadge
      tags: [admin]
      summary: Grant or revoke a company's "Verified Supplier" badge
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verifiedBadge]
              properties:
                verifiedBadge:
                  type: boolean
      responses:
        "200":
          description: Updated company
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
  /admin/companies/{id}/credit-terms:
    patch:
      operationId: updateCompanyCreditTerms
      tags: [finance]
      summary: Set a buyer company's credit term (Net 15/30/60) and credit limit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCreditTermsBody"
      responses:
        "200":
          description: Updated company
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
  /vendor/order-rules:
    patch:
      operationId: updateVendorOrderRules
      tags: [companies]
      summary: Configure minimum order value, free shipping threshold, and max order quantity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVendorOrderRulesBody"
      responses:
        "200":
          description: Updated company
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"

  /compliance/certificates:
    post:
      operationId: createComplianceCertificate
      tags: [compliance]
      summary: Upload a compliance certificate (FDA/CE/ISO/GMP) for review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateComplianceCertificateBody"
      responses:
        "201":
          description: Certificate submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceCertificate"
  /compliance/certificates/mine:
    get:
      operationId: listMyComplianceCertificates
      tags: [compliance]
      summary: List the current vendor's compliance certificates
      responses:
        "200":
          description: Certificates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ComplianceCertificate"
  /admin/compliance/certificates:
    get:
      operationId: listAdminComplianceCertificates
      tags: [compliance]
      summary: List all compliance certificates for admin review
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, approved, rejected, expired]
      responses:
        "200":
          description: Certificates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ComplianceCertificateWithVendor"
  /admin/compliance/certificates/{id}/status:
    patch:
      operationId: updateComplianceCertificateStatus
      tags: [compliance]
      summary: Approve or reject a compliance certificate
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [approved, rejected]
                adminNote:
                  type: string
      responses:
        "200":
          description: Updated certificate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceCertificate"

  /returns:
    post:
      operationId: createReturn
      tags: [returns]
      summary: Submit a return, damage claim, or missing-item claim for an order item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReturnBody"
      responses:
        "201":
          description: Return request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Return"
  /returns/mine:
    get:
      operationId: listMyReturns
      tags: [returns]
      summary: List the current buyer's return requests
      responses:
        "200":
          description: Returns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Return"
  /returns/vendor:
    get:
      operationId: listVendorReturns
      tags: [returns]
      summary: List return requests for the current vendor's orders
      responses:
        "200":
          description: Returns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Return"
  /admin/returns:
    get:
      operationId: listAdminReturns
      tags: [returns]
      summary: List all return/dispute requests for admin mediation
      responses:
        "200":
          description: Returns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Return"
  /returns/{id}/status:
    patch:
      operationId: updateReturnStatus
      tags: [returns]
      summary: Update a return's status (vendor or admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [under_review, approved, rejected, refunded]
                adminNote:
                  type: string
      responses:
        "200":
          description: Updated return
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Return"

  /procurement/approval-chain:
    get:
      operationId: getApprovalChain
      tags: [procurement]
      summary: Get the current buyer company's procurement approval chain
      responses:
        "200":
          description: Approval chain (null if none configured)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ApprovalChain"
                  - type: "null"
    put:
      operationId: setApprovalChain
      tags: [procurement]
      summary: Configure the buyer company's multi-step approval chain
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetApprovalChainBody"
      responses:
        "200":
          description: Saved approval chain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalChain"
  /procurement/approvals:
    get:
      operationId: listApprovalRequests
      tags: [procurement]
      summary: List approval requests for the current buyer company
      responses:
        "200":
          description: Approval requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApprovalRequest"
  /procurement/approvals/{id}/decision:
    post:
      operationId: decideApprovalRequest
      tags: [procurement]
      summary: Approve or reject the current step of an approval request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [approved, rejected]
                note:
                  type: string
      responses:
        "200":
          description: Updated approval request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalRequest"

  /admin/commission-rules:
    get:
      operationId: listCommissionRules
      tags: [finance]
      summary: List commission rules
      responses:
        "200":
          description: Commission rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommissionRule"
    post:
      operationId: createCommissionRule
      tags: [finance]
      summary: Create a commission rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommissionRuleInput"
      responses:
        "201":
          description: Created rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommissionRule"
  /admin/commission-rules/{id}:
    patch:
      operationId: updateCommissionRule
      tags: [finance]
      summary: Update a commission rule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommissionRuleInput"
      responses:
        "200":
          description: Updated rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommissionRule"
    delete:
      operationId: deleteCommissionRule
      tags: [finance]
      summary: Delete a commission rule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"

  /wallet/mine:
    get:
      operationId: getMyWallet
      tags: [finance]
      summary: Get the current vendor's wallet balance and recent transactions
      responses:
        "200":
          description: Wallet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletSummary"
  /wallet/payout-requests:
    post:
      operationId: createPayoutRequest
      tags: [finance]
      summary: Request a payout from available balance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePayoutRequestBody"
      responses:
        "201":
          description: Payout request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayoutRequest"
  /wallet/payout-requests/mine:
    get:
      operationId: listMyPayoutRequests
      tags: [finance]
      summary: List the current vendor's payout requests
      responses:
        "200":
          description: Payout requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PayoutRequest"
  /admin/payout-requests:
    get:
      operationId: listAdminPayoutRequests
      tags: [finance]
      summary: List all vendor payout requests
      responses:
        "200":
          description: Payout requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PayoutRequestWithVendor"
  /admin/payout-requests/{id}/status:
    patch:
      operationId: updatePayoutRequestStatus
      tags: [finance]
      summary: Approve, reject, or mark a payout request as paid
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [approved, rejected, paid]
      responses:
        "200":
          description: Updated payout request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayoutRequest"

  /invoices/mine:
    get:
      operationId: listMyInvoices
      tags: [finance]
      summary: List the current buyer company's invoices (credit-term orders)
      responses:
        "200":
          description: Invoices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invoice"
  /admin/invoices:
    get:
      operationId: listAdminInvoices
      tags: [finance]
      summary: List all invoices
      responses:
        "200":
          description: Invoices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InvoiceWithBuyer"
  /admin/invoices/{id}/status:
    patch:
      operationId: updateInvoiceStatus
      tags: [finance]
      summary: Mark an invoice as paid
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [paid, overdue]
      responses:
        "200":
          description: Updated invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"

  /offers/{id}/batches:
    get:
      operationId: listOfferBatches
      tags: [batches]
      summary: List batch/lot records for a vendor offer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Batches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductBatch"
    post:
      operationId: createOfferBatch
      tags: [batches]
      summary: Record a new batch/lot for a vendor offer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductBatchBody"
      responses:
        "201":
          description: Batch created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductBatch"
  /vendor/batches/expiring:
    get:
      operationId: listVendorExpiringBatches
      tags: [batches]
      summary: Near-expiry / expired batch report for the current vendor
      parameters:
        - name: withinDays
          in: query
          required: false
          schema:
            type: integer
            default: 30
      responses:
        "200":
          description: Batches nearing expiry, ordered soonest-first (FEFO)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductBatchWithProduct"
  /admin/batches/expiring:
    get:
      operationId: listAdminExpiringBatches
      tags: [batches]
      summary: Marketplace-wide near-expiry / expired batch report (for recall management)
      parameters:
        - name: withinDays
          in: query
          required: false
          schema:
            type: integer
            default: 30
      responses:
        "200":
          description: Batches nearing expiry across all vendors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductBatchWithProduct"

  /products/{id}/substitutes:
    get:
      operationId: listProductSubstitutes
      tags: [substitutes]
      summary: List suggested alternative products
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Substitutes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductSubstituteWithProduct"
    post:
      operationId: createProductSubstitute
      tags: [substitutes]
      summary: Suggest an alternative product (vendor)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductSubstituteBody"
      responses:
        "201":
          description: Substitute suggestion created
          content:
            application/json:
              schema:
