      required: [vendorCompanyId, vendorName, totalOrders, totalRevenue, avgRating]
      properties:
        vendorCompanyId:
          type: integer
        vendorName:
          type: string
        totalOrders:
          type: integer
        totalRevenue:
          type: number
        avgRating:
          type: number
    CommissionReportRow:
      type: object
      required: [subtype, ratePercent, totalRevenue, totalCommission]
      properties:
        subtype:
          type: string
        ratePercent:
          type: number
        totalRevenue:
          type: number
        totalCommission:
          type: number

    AuditLog:
      type: object
      required: [id, userId, action, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: string
        action:
          type: string
        entityType:
          type: [string, "null"]
        entityId:
          type: [integer, "null"]
        metadata:
          type: [object, "null"]
        createdAt:
          type: string
          format: date-time
