components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

    DeleteResult:
      type: object
      required: [success]
      properties:
        success:
          type: boolean

    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, "null"]
          format: email
        firstName:
          type: [string, "null"]
        lastName:
          type: [string, "null"]
        profileImageUrl:
          type: [string, "null"]
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"

    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        firstName:
          type: string
        lastName:
          type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    MyProfile:
      type: object
      required: [userId, role, companyId, company, user]
      properties:
        userId:
          type: string
        role:
          type: string
          enum: [buyer, vendor, admin]
        companyId:
          type: [integer, "null"]
        company:
          oneOf:
            - $ref: "#/components/schemas/Company"
            - type: "null"
        user:
          $ref: "#/components/schemas/AuthUser"
        adminRole:
          type: [string, "null"]
          enum: [super_admin, operations_manager, finance_manager, product_manager, customer_support, procurement_manager, null]

    OnboardInput:
      type: object
      required: [role, company]
      properties:
        role:
          type: string
          enum: [buyer, vendor]
        company:
          $ref: "#/components/schemas/CompanyInput"

    Company:
      type: object
      required: [id, name, type, subtype, status, registrationNumber, taxInfo, address, contactPhone, contactEmail, ownerUserId, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string
          enum: [vendor, buyer]
        subtype:
          type: string
        registrationNumber:
          type: [string, "null"]
        taxInfo:
          type: [string, "null"]
        address:
          type: [string, "null"]
        contactPhone:
          type: [string, "null"]
        contactEmail:
          type: [string, "null"]
        status:
          type: string
          enum: [pending, approved, rejected, suspended]
        ownerUserId:
          type: string
        createdAt:
          type: string
          format: date-time
        verifiedBadge:
          type: boolean
        minOrderValue:
          type: [number, "null"]
        freeShippingThreshold:
          type: [number, "null"]
        maxOrderQty:
          type: [integer, "null"]
        creditTerm:
          type: string
          enum: [none, net15, net30, net60]
        creditLimit:
          type: [number, "null"]
        outstandingBalance:
          type: number
    CompanyInput:
      type: object
      required: [name, type, subtype]
      properties:
        name:
          type: string
          minLength: 1
        type:
          type: string
          enum: [vendor, buyer]
        subtype:
          type: string
          minLength: 1
        registrationNumber:
          type: string
        taxInfo:
          type: string
        address:
          type: string
        contactPhone:
          type: string
        contactEmail:
          type: string
    CompanyStatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, approved, rejected, suspended]

    AdminDashboardStats:
      type: object
      required: [totalRevenue, totalOrders, activeVendors, activeBuyers, pendingApprovals, totalProducts, openRfqs]
      properties:
        totalRevenue:
          type: number
        totalOrders:
          type: integer
        activeVendors:
          type: integer
        activeBuyers:
          type: integer
        pendingApprovals:
          type: integer
        totalProducts:
          type: integer
        openRfqs:
          type: integer
        pendingCompliance:
          type: integer
        pendingReturns:
          type: integer
        pendingApprovalRequests:
          type: integer
        pendingPayouts:
          type: integer
        lowStockOffers:
          type: integer
        topVendors:
          type: array
          items:
            $ref: "#/components/schemas/VendorPerformanceStat"
        topProducts:
          type: array
          items:
            $ref: "#/components/schemas/ProductPerformanceStat"

    VendorPerformanceStat:
      type: object
      required: [vendorCompanyId, vendorName, totalOrders, revenue]
      properties:
        vendorCompanyId:
          type: integer
        vendorName:
          type: string
        totalOrders:
          type: integer
        revenue:
          type: number
    ProductPerformanceStat:
      type: object
      required: [productId, productName, unitsSold, revenue]
      properties:
        productId:
          type: integer
        productName:
          type: string
        unitsSold:
          type: integer
        revenue:
          type: number

    VendorDashboardStats:
      type: object
      required: [totalOffers, totalOrders, revenue, openRfqs]
      properties:
        totalOffers:
          type: integer
        totalOrders:
          type: integer
        revenue:
          type: number
        openRfqs:
          type: integer

    Category:
      type: object
      required: [id, name, slug]
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
    CategoryInput:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
          minLength: 1
        slug:
          type: string
          minLength: 1

    Product:
      type: object
      required: [id, categoryId, name, description, unit, imageUrl, createdAt]
      properties:
        id:
          type: integer
        categoryId:
          type: integer
        name:
          type: string
        description:
          type: [string, "null"]
        unit:
          type: string
        imageUrl:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
    ProductInput:
      type: object
      required: [categoryId, name, unit]
      properties:
        categoryId:
          type: integer
        name:
          type: string
          minLength: 1
        description:
          type: string
        unit:
          type: string
          minLength: 1
        imageUrl:
          type: string
    ProductWithStats:
      allOf:
        - $ref: "#/components/schemas/Product"
        - type: object
          required: [categoryName, offerCount, minPrice]
          properties:
            categoryName:
              type: string
            offerCount:
              type: integer
            minPrice:
              type: [number, "null"]

    PriceTier:
      type: object
      required: [minQty, maxQty, price]
      properties:
        minQty:
          type: integer
        maxQty:
          type: [integer, "null"]
        price:
          type: number

    VendorOffer:
      type: object
      required: [id, productId, vendorCompanyId, price, moq, stock, deliveryDays, priceTiers, status, createdAt]
      properties:
        id:
          type: integer
        productId:
          type: integer
        variantId:
          type: [integer, "null"]
        vendorCompanyId:
          type: integer
        warehouseId:
          type: [integer, "null"]
        price:
          type: number
        moq:
          type: integer
        stock:
          type: integer
        lowStockThreshold:
          type: integer
        deliveryDays:
          type: integer
        priceTiers:
          type: array
          items:
            $ref: "#/components/schemas/PriceTier"
        status:
          type: string
          enum: [active, inactive]
        createdAt:
          type: string
          format: date-time
    VendorOfferInput:
      type: object
      required: [productId, price, moq, stock, deliveryDays, priceTiers]
      properties:
        productId:
          type: integer
        variantId:
          type: integer
        warehouseId:
          type: integer
        lowStockThreshold:
          type: integer
          minimum: 0
        price:
          type: number
          minimum: 0
        moq:
          type: integer
          minimum: 1
        stock:
          type: integer
          minimum: 0
        deliveryDays:
          type: integer
          minimum: 0
        priceTiers:
          type: array
          items:
            $ref: "#/components/schemas/PriceTier"
    VendorOfferUpdate:
      type: object
      properties:
        price:
          type: number
        moq:
          type: integer
        stock:
          type: integer
        warehouseId:
          type: integer
        lowStockThreshold:
          type: integer
        deliveryDays:
          type: integer
        priceTiers:
          type: array
          items:
            $ref: "#/components/schemas/PriceTier"
        status:
          type: string
          enum: [active, inactive]
    OfferWithVendor:
      allOf:
        - $ref: "#/components/schemas/VendorOffer"
        - type: object
          required: [vendorName, vendorSubtype]
          properties:
            vendorName:
              type: string
            vendorSubtype:
              type: string
    OfferWithProduct:
      allOf:
        - $ref: "#/components/schemas/VendorOffer"
        - type: object
          required: [productName, productUnit]
          properties:
            productName:
              type: string
            productUnit:
              type: string

    CartItem:
      type: object
      required: [id, userId, offerId, quantity, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: string
        offerId:
          type: integer
        quantity:
          type: integer
        createdAt:
          type: string
          format: date-time
    CartItemInput:
      type: object
      required: [offerId, quantity]
      properties:
        offerId:
          type: integer
        quantity:
          type: integer
          minimum: 1
    CartItemUpdate:
      type: object
      required: [quantity]
      properties:
        quantity:
          type: integer
          minimum: 1
    CartItemWithDetails:
      allOf:
        - $ref: "#/components/schemas/CartItem"
        - type: object
          required: [productId, productName, productUnit, vendorCompanyId, vendorName, unitPrice, moq, stock]
          properties:
            productId:
              type: integer
            productName:
              type: string
            productUnit:
              type: string
            vendorCompanyId:
              type: integer
            vendorName:
              type: string
            unitPrice:
              type: number
            moq:
              type: integer
            stock:
              type: integer

    Order:
      type: object
      required: [id, buyerUserId, buyerCompanyId, status, totalAmount, createdAt]
      properties:
        id:
          type: integer
        buyerUserId:
          type: string
        buyerCompanyId:
          type: [integer, "null"]
        status:
          type: string
          enum: [pending, confirmed, shipped, completed, cancelled]
        totalAmount:
          type: number
        createdAt:
          type: string
          format: date-time
    OrderItemDetail:
      type: object
      required: [id, orderId, offerId, productId, productName, vendorCompanyId, vendorName, quantity, unitPrice, subtotal]
      properties:
        id:
          type: integer
        orderId:
          type: integer
        offerId:
          type: integer
        productId:
          type: integer
        productName:
          type: string
        vendorCompanyId:
          type: integer
        vendorName:
          type: string
        quantity:
          type: integer
        unitPrice:
          type: number
        subtotal:
          type: number
    OrderWithItems:
      allOf:
        - $ref: "#/components/schemas/Order"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/OrderItemDetail"
    VendorOrderItem:
      allOf:
        - $ref: "#/components/schemas/OrderItemDetail"
        - type: object
          required: [orderStatus, orderCreatedAt]
          properties:
            orderStatus:
              type: string
